<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · 每周挽留预算决策板（你自己动手试）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { background:#EEF1F6; color:#1A2230; font-size:16px; }
  .topbar { background:#0E3F8C; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .topbar .logo { font-size:20px; font-weight:bold; }
  .topbar .logo span { font-weight:normal; font-size:13px; margin-left:8px; color:#9FC1F0; }
  .topbar .note { margin-left:auto; font-size:14px; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:12px; }
  .positioning { background:#FFF8E7; border-bottom:1px solid #F0DCA8; padding:10px 20px; font-size:15px; color:#6B5320; }
  .tabs { display:flex; gap:4px; padding:12px 20px 0; background:#fff; border-bottom:1px solid #D6DCE5; flex-wrap:wrap; }
  .tab { padding:11px 22px; font-size:16px; cursor:pointer; color:#4A5568; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; }
  .tab.active { background:#0E3F8C; color:#fff; font-weight:bold; }
  .main { padding:16px 20px 60px; max-width:1200px; margin:0 auto; }
  .panel { background:#fff; border:1px solid #D6DCE5; border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .panel h2 { font-size:17px; color:#0E3F8C; margin-bottom:12px; }
  .panel h2 .hint { font-weight:normal; font-size:13px; color:#8B97A8; margin-left:8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid #D6DCE5; border-radius:10px; padding:14px 16px; }
  .kpi .t { font-size:13px; color:#6B7686; }
  .kpi .v { font-size:24px; font-weight:bold; color:#0E3F8C; margin-top:4px; }
  .kpi .v small { font-size:13px; color:#6B7686; }
  .kpi.warn .v { color:#C0392B; }
  .kpi .sub { font-size:12px; color:#8B97A8; margin-top:5px; line-height:1.4; }
  table { width:100%; border-collapse:collapse; font-size:14.5px; }
  th { background:#F7F9FC; color:#4A5568; text-align:left; padding:9px 10px; border-bottom:2px solid #D6DCE5; white-space:nowrap; }
  td { padding:10px 10px; border-bottom:1px solid #EEF1F6; vertical-align:middle; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover { background:#F2F7FD; }
  tr.alert-row { background:#FFF3F3; }
  .badge { display:inline-block; font-size:12px; padding:2px 9px; border-radius:10px; white-space:nowrap; }
  .b-high { background:#FDECEA; color:#C0392B; border:1px solid #F2B8B5; }
  .b-medium { background:#FFF4E5; color:#B26A00; border:1px solid #F0D9B5; }
  .b-normal { background:#E8F5E9; color:#2E7D32; border:1px solid #BFD8C0; }
  .b-low, .b-C { background:#E4E7EC; color:#6B7686; }
  .b-no_consent { background:#EDE7F6; color:#5E35B1; border:1px solid #CEBEE8; }
  .cid { font-weight:bold; color:#0E3F8C; }
  .money { font-variant-numeric:tabular-nums; }
  .btn { border:none; border-radius:6px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .btn.approve { background:#2E7D32; color:#fff; }
  .btn.approve:hover { background:#1B5E20; }
  .btn.suppress { background:#C0392B; color:#fff; }
  .btn.suppress:hover { background:#8E2A20; }
  .btn:disabled { background:#E4E7EC; color:#8B97A8; cursor:not-allowed; }
  .seg { margin:10px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { border:1px solid #C3D4EE; background:#F0F5FC; color:#1E4FA8; padding:6px 14px; border-radius:16px; font-size:14px; cursor:pointer; }
  .seg button.active { background:#1E4FA8; color:#fff; }
  .muted { color:#8B97A8; }
  .gatebar { font-size:14.5px; color:#5A6778; background:#F7F9FC; border:1px solid #D6DCE5; border-radius:8px; padding:11px 14px; margin-bottom:14px; line-height:1.6; }
  .gatebar b { color:#C0392B; }
  .tool { background:#F4F8FF; border:1px dashed #9FB8E0; border-radius:10px; padding:14px 16px; margin:14px 0; }
  .tool h3 { font-size:15px; color:#0E3F8C; margin-bottom:8px; }
  .btn-ok { background:#0E3F8C; color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:15px; cursor:pointer; }
  [big="1"]{ font-size:17px; }
  input[type=range]{ width:100%; height:34px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#0E3F8C; color:#fff; padding:12px 20px; border-radius:10px; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.2); opacity:0; transition:opacity .3s; z-index:99; }
  .toast.show{ opacity:1; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:13px; color:#4A5568; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Pulse<span>Module 3 · 每周挽留预算决策板</span></div>
  <div class="note">这是「可以动手试」的演示页 · 双击打开就能用</div>
</div>
<div class="positioning">
  🔑 <b>一句话：</b>Pulse 不是告诉你谁要跑了，它是告诉你这周的挽留预算 <b>该花在谁身上、花多少、以及为什么对有些人一分都不花</b>。<br>
  <span style="font-size:13px">下面三个页签，你每点一下、每按一个键，都是真正的功能——不是摆样子的图。</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="stores">① 门店健康</div>
  <div class="tab" data-tab="actions">② 行动清单</div>
  <div class="tab" data-tab="budget">③ 灵活预算</div>
  <div class="tab" data-tab="audit">④ 审批记录</div>
</div>

<div class="main">
  <div id="tab-stores"></div>
  <div id="tab-actions" class="hidden"></div>
  <div id="tab-budget" class="hidden"></div>
  <div id="tab-audit" class="hidden"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ================= 内嵌的演示数据（来自真实合成库算出） ================= */
const GROUPS = { high:417, medium:505, normal:3281, low:768, C:733, no_consent:12 };

// 门店健康：25 家里，本周 1 家告警（PCC016）。week 13 = 2026-01-31 回放
const STORES = [
  {id:'PCC016', district:'九龙湾', type:'写字楼', regs:88, specific:-0.105, ownP10:-0.070, alert:true, reason:'specific −0.105 低于自身 P10（−0.070）。外部因（天气/客流/假日）本版未接入，标“待核实”。'},
  {id:'PCC015', district:'沙田', type:'商场', regs:72, specific:-0.052, ownP10:-0.088, alert:false, reason:'在自身历史区间内'},
  {id:'PCC021', district:'屯门', type:'住宅', regs:64, specific:-0.046, ownP10:-0.076, alert:false, reason:'在自身历史区间内'},
  {id:'PCC001', district:'中环', type:'写字楼', regs:95, specific:-0.033, ownP10:-0.074, alert:false, reason:'在自身历史区间内'},
  {id:'PCC008', district:'铜锣湾', type:'商场', regs:71, specific:-0.028, ownP10:-0.066, alert:false, reason:'在自身历史区间内'},
  {id:'PCC011', district:'将军澳', type:'住宅', regs:60, specific:-0.021, ownP10:-0.058, alert:false, reason:'在自身历史区间内'},
  {id:'PCC003', district:'金钟', type:'写字楼', regs:50, specific:-0.012, ownP10:-0.055, alert:false, reason:'在自身历史区间内'},
  {id:'PCC020', district:'观塘', type:'写字楼', regs:48, specific:+0.005, ownP10:-0.060, alert:false, reason:'在自身历史区间内'},
  {id:'PCC002', district:'中环', type:'地铁', regs:66, specific:+0.012, ownP10:-0.050, alert:false, reason:'在自身历史区间内'},
  {id:'PCC022', district:'元朗', type:'商场', regs:58, specific:+0.020, ownP10:-0.055, alert:false, reason:'在自身历史区间内'},
  // 其余 15 家略（same style, 都正常）
];
// 补足到 25 家（只展示告警的即可证明“门店健康”存在）
for (let i=0; STORES.length<25; i++) {
  STORES.push({id:'PCC0'+(String(20+i)), district:'其他', type:'混合', regs:40+i,
    specific:0.01*Math.floor(i*0.7), ownP10:-0.05, alert:false, reason:'在自身历史区间内'});
}

// 行动清单：真实名单里的可批准头部 + 各分组代表（内嵌，够演示）
const ACTIONS = [
  // high（可批准，HK$50 上限）
  {cid:'C03679', store:'PCC016', group:'high', label:'高价值+偏离', sil:19, base:1, dev:12.7, erv:7182, net:7132, ch:'app_push', cap:50, can:true},
  {cid:'C02361', store:'PCC001', group:'high', label:'高价值+偏离', sil:6,  base:3, dev:2.0, erv:5207, net:5157, ch:'whatsapp', cap:50, can:true},
  {cid:'C03957', store:'PCC008', group:'high', label:'高价值+偏离', sil:6,  base:4, dev:1.5, erv:4820, net:4770, ch:'whatsapp', cap:50, can:true},
  {cid:'C03893', store:'PCC011', group:'high', label:'高价值+偏离', sil:7,  base:4, dev:1.6, erv:4538, net:4488, ch:'whatsapp', cap:50, can:true},
  {cid:'C00217', store:'PCC021', group:'high', label:'高价值+偏离', sil:16, base:6, dev:2.7, erv:4462, net:4412, ch:'whatsapp', cap:50, can:true},
  // medium（可批准，HK$30 上限）
  {cid:'C01042', store:'PCC003', group:'medium', label:'中价值+偏离', sil:12, base:5, dev:2.4, erv:2450, net:2420, ch:'email', cap:30, can:true},
  {cid:'C01877', store:'PCC022', group:'medium', label:'中价值+偏离', sil:20, base:8, dev:2.5, erv:1980, net:1950, ch:'whatsapp', cap:30, can:true},
  {cid:'C02731', store:'PCC016', group:'medium', label:'中价值+偏离', sil:9,  base:4, dev:2.3, erv:1560, net:1530, ch:'app_push', cap:30, can:true},
  // normal（不用管，0 元，不可批）
  {cid:'C02237', store:'PCC001', group:'normal', label:'节奏正常·不用管', sil:33, base:30, dev:1.1, erv:120, net:0, ch:'—', cap:0, can:false},
  {cid:'C04420', store:'PCC008', group:'normal', label:'节奏正常·不用管', sil:45, base:45, dev:1.0, erv:95, net:0, ch:'—', cap:0, can:false},
  // low（低价值·不花）
  {cid:'C05190', store:'PCC020', group:'low', label:'低价值·不花', sil:40, base:10, dev:4.0, erv:180, net:0, ch:'—', cap:0, can:false},
  // C（历史太少）
  {cid:'C00331', store:'PCC011', group:'C', label:'历史太少', sil:25, base:null, dev:null, erv:60, net:0, ch:'—', cap:0, can:false},
  // no_consent（无同意·拦截）
  {cid:'C05260', store:'PCC015', group:'no_consent', label:'无同意·拦截', sil:74, base:21, dev:3.5, erv:760, net:0, ch:'—', cap:0, can:false},
];

const LABEL = {high:'高价值+偏离', medium:'中价值+偏离', normal:'不用管', low:'低价值·不花', C:'历史太少', no_consent:'无同意·拦截', all:'全部'};
const TOTAL = 5716;  // 本切口干被评分的客户总数

// ================= 审批记录（存在浏览器里，点批准就会进来） =================
let AUDIT = [];
try { AUDIT = JSON.parse(localStorage.getItem('pulse_audit')||'[]'); } catch(e){}
function saveAudit(){ localStorage.setItem('pulse_audit', JSON.stringify(AUDIT)); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function activeTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name));
  ['stores','actions','budget','audit'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden', k!==name));
}

/* ================= ① 门店健康 ================= */
let selStore = '';
function renderStores(){
  const el = document.getElementById('tab-stores');
  const alertCount = STORES.filter(s=>s.alert).length;
  // 当前有没有抑制记录
  const suppressed = AUDIT.filter(r=>r.type==='suppress').map(r=>r.store);
  let html = `<div class="gatebar">门店健康：Green='出了一家告警' PCC016 → 点这一行，看它店里的常客是谁。<br>
    <b>记住：</b>门店层决定<b>这周在这家店花不花钱</b>；发给谁、发多少仍在个人层决定。</div>`;
  html += `<div class="panel"><h2>各店常客健康<span class="hint">点击告警行钻取 → 到「行动清单」并只留这家店</span></h2><table>
    <tr><th>门店</th><th>区域/类型</th><th>周常客</th><th>漂移 specific</th><th>自身P10</th><th>状态</th><th>动手</th></tr>`;
  for (const s of STORES){
    const isSup = suppressed.includes(s.id);
    html += `<tr class="${s.alert?'clickable alert-row':''}" ${s.alert?`onclick="drillStore('${s.id}')"`:''}>
      <td class="cid">${s.id}</td><td>${s.district} / ${s.type}</td><td>${s.regs} 人</td>
      <td class="money">${s.specific>0?'+':''}${s.specific.toFixed(3)}</td>
      <td class="money">${s.ownP10.toFixed(3)}</td>
      <td>${s.alert?'<span class="badge b-high">需排查/本周不发券</span>':'<span class="badge b-normal">正常</span>'} ${isSup?'<span class="badge b-no_consent">已抑制</span>':''}</td>
      <td>${s.alert?`<button class="btn suppress" onclick="event.stopPropagation();suppressStore('${s.id}')">${isSup?'已记录':'记录：本周不花钱'}</button>`:'<span class="muted">—</span>'}</td>
    </tr>`;
  }
  html += `</table>
    <div class="legend"><span><i style="background:#FFF3F3"></i>告警/需排查</span><span><i style="background:#E8F5E9"></i>正常</span></div>
    <div class="muted" style="margin-top:8px">读法：本页 25 家店，本周 ${alertCount} 家告警（默认回放周 week 13 = 2026-01-31）。告警≠自动发券，先查原因。</div></div>`;
  el.innerHTML = html;
}
function drillStore(id){
  selStore = id;
  activeTab('actions');
  renderActions('all');
  toast('已钻取到 '+id+' 的名单');
}
function suppressStore(id){
  if (AUDIT.some(r=>r.type==='suppress' && r.store===id)){ toast('这家店本周已记录“不花钱”'); return; }
  const reason = prompt('请写一句理由（如：该店商场改造，属结构性原因）：');
  if (reason===null) return;
  const rec = {type:'suppress', store:id, reason:(reason||'未填理由'), approver:'我', at:now()};
  AUDIT.unshift(rec); saveAudit();
  renderStores(); toast('已记录：'+id+' 本周不花钱' + (reason?'，理由："'+reason+'"':''));
}

/* ================= ② 行动清单 ================= */
let curGroup = 'all';
function renderActions(group){
  curGroup = group;
  const el = document.getElementById('tab-actions');
  let rows = ACTIONS.filter(r => group==='all' || r.group===group);
  if (selStore) rows = rows.filter(r => r.store===selStore);
  // 展示一部分（这是演示名单，真实服务里是 5,716 行全部）
  const cols = ['high','medium','normal','low','C','no_consent'];
  let html = `<div class="gatebar">行动清单：按“净收益”排序，值最大的在最上面。<b>只有高/中价值且有同意的人</b>才显示“批准”按钮；其余系统自动给理由，经理不用一张张看。
    ${selStore?`目前只看 <b>${selStore}</b> 店。`:'全部 25 店。'} (演示只内嵌${rows.length}条代表行；完整服务是 ${TOTAL} 行，界面显示“${rows.length} / ${TOTAL}”)</div>`;
  html += `<div class="seg">` + cols.map(g=>`<button class="${g===group?'active':''}" onclick="renderActions('${g}')">${LABEL[g]} (${GROUPS[g]})</button>`).join('') + `</div>`;
  html += `<div class="panel"><h2>待处理名单<span class="hint">按净收益降序</span></h2><table>
    <tr><th>客户</th><th>门店</th><th>分组</th><th>静默</th><th>个人基准</th><th>偏离</th><th>ERV(未来值)</th><th>渠道</th><th>建议+上限</th><th>操作</th></tr>`;
  for (const r of rows){
    const bcls={high:'b-high',medium:'b-medium',normal:'b-normal',low:'b-low',C:'b-C',no_consent:'b-no_consent'}[r.group];
    html += `<tr>
      <td class="cid">${r.cid}</td><td>${r.store}</td>
      <td><span class="badge ${bcls}">${r.label}</span></td>
      <td>${r.sil}天</td><td>${r.base!==null?r.base+'天':'—'}</td>
      <td>${r.dev!==null?r.dev+'×':'—'}</td>
      <td class="money">HK$${r.erv.toLocaleString()}</td>
      <td class="muted">${r.ch}</td>
      <td>${r.action2||(r.can?('发券 · 上限 <b class="money">HK$'+r.cap+'</b>'):r.group==='no_consent'?'无有效同意，这行选不了':(r.group==='C'?'历史太少，下周再看':'不花这笔钱（预计自己会回来）'))}</td>
      <td>${r.can?`<button class="btn approve" onclick="approveRow('${r.cid}','${r.group}','${r.ch}','${r.store}','${r.cap}')">批准</button>`:'<span class="muted">—</span>'}</td>
    </tr>`;
  }
  html += `</table>
    <div class="muted" style="margin-top:8px">规则定金额，人写理由，服务端再查一次同意。客户端改不了上限。</div></div>`;
  el.innerHTML = html;
}
function approveRow(cid, group, ch, store, cap){
  const reason = prompt('请填书面理由（必须写，作业要求“理由+操作人”）：\n如：较自身节奏偏离 12.7 倍，历史对 app 推送响应好');
  if (reason===null) return;
  const approver = prompt('请填你的名字（操作人）：', '我');
  if (approver===null) return;
  const rec = {type:'approve', cid, group, ch, cap, store, reason:(reason||'未填'), approver:(approver||'我'), at:now()};
  AUDIT.unshift(rec); saveAudit();
  renderActions(curGroup);
  toast('已批准 '+cid+' · '+ch+' · '+cap+' · 理由已归档');
}

/* ================= ③ 灵活预算 ================= */
// 每家店“值得联系”（高+中价值）的人数，用于算这家店的预算份额
const STORE_ACTIONABLE = {PCC016:58, PCC001:66, PCC008:49, PCC011:41, PCC003:33,
  PCC021:44, PCC015:38, PCC020:27, PCC022:36, PCC002:45};
function storeActionable(id){ return STORE_ACTIONABLE[id] || 40; }
function suppressedSet(){
  const out = new Set();
  for (const r of AUDIT) if (r.type==='suppress') out.add(r.store);
  return out;
}
function renderBudget(){
  const el = document.getElementById('tab-budget');
  const face = 44;     // 平均券面值示意
  el.innerHTML = `
  <div class="gatebar">灵活预算：<b>预算跟着机会走，不是固定数</b>。名单变大但预算没跟上，看板会提醒你。</div>
  <div class="panel">
    <h2>🏦 下周该批多少预算？（你问的这块，之前漏了，现在补上）<span class="hint">由“值得联系的人 × 每张券成本”推导</span></h2>
    <div class="tool">
      <div style="font-size:20px;font-weight:bold" id="recOut"></div>
      <div class="muted" style="margin-top:6px">怎么来的：本周【高价值 + 中价值】共 <b>922 人</b>值得联系，按平均券面值 <input type="number" id="budgetFace" value="${face}" style="width:80px" oninput="updateBudget()"> HK$/人，建议预算 = 人数 × 券面值。<br>
      <b>名单变大、预算没跟上 → 看板亮「加预算」</b>——这就是“灵活”的意思。</div>
      <div id="warnOut" style="font-size:16px;color:#B26A00;margin-top:8px"></div>
    </div>
    <div class="tool"><h3>🎚 拖动滑块：这周实际批多少张券？（你手动决定）</h3>
      <input type="range" id="budgetRange" min="0" max="1000" value="350" oninput="updateBudget()">
      <div id="budgetOut" style="font-size:22px;font-weight:bold;margin:8px 0"></div>
      <div class="muted" id="budgetSub"></div>
    </div>
    <div class="tool"><h3>🛑 门店层“记录暂停预算”是怎么影响钱的</h3>
      <div id="stallOut" style="font-size:16px;margin:4px 0"></div>
      <div class="muted">去「① 门店健康」点一家告警店 → “记录：本周不花钱”，这家店应发的券就转入<b>“暂不发”</b>，下面会显示省了多少张。这就是你能用鼠标验证的“抑制”功能。</div>
    </div>
    <div class="tool"><h3>🏷 “不用管”这部分，省下多少张券？</h3>
      <div id="saveOut" style="font-size:18px;font-weight:bold;margin:4px 0"></div>
      <div class="muted">被标记“不用管/低价值”的人里，约 55% 本来就会自己回来（凭个人节奏推定）。不发券就不重复打折（票面价）；再乘兑换率×毛利率才是真现金。</div>
    </div>
    <div class="tool"><h3>🧮 手动改参数，看本周真现金省多少</h3>
      <label>券面值 HK$ <input type="number" id="faceV" value="${face}" style="width:80px" oninput="updateBudget()"></label>
      <label style="margin-left:12px">兑换率 <input type="number" id="redV" value="0.30" step="0.05" style="width:70px" oninput="updateBudget()"></label>
      <label style="margin-left:12px">毛利率 <input type="number" id="marV" value="0.65" step="0.05" style="width:70px" oninput="updateBudget()"></label>
      <div id="cashOut" style="font-size:18px;font-weight:bold;margin-top:10px"></div>
    </div>
  </div>`;
  updateBudget();
}
function updateBudget(){
  const weekly = document.getElementById('budgetRange').value|0;
  const face = document.getElementById('faceV').value|0;
  const bface = document.getElementById('budgetFace').value|0;
  const red = document.getElementById('redV').value|0;
  const mar = document.getElementById('marV').value|0;

  // 下周预算建议 = 值得联系人数 × 券面值
  const actionable = GROUPS.high + GROUPS.medium;   // 922
  const recommended = Math.round(actionable * bface);
  document.getElementById('recOut').textContent = '建议 “下周预算” = HK$' + recommended.toLocaleString();
  document.getElementById('warnOut').textContent = '本周值得联系 ' + actionable.toLocaleString() + ' 人 → 建议预算 HK$' + recommended.toLocaleString() + '；上次是 HK$' + (recommended*0.9).toLocaleString() + ' → 名单变了 ' + (recommended>recommended*0.9?'↑ 预算跟着涨':'→ 持平') ;

  // 门店抑制：把这家店应发的券转入“暂不发”
  const sup = suppressedSet();
  let stallCoupons = 0;
  if (sup.size) for (const id of sup) stallCoupons += storeActionable(id);
  const idle = document.getElementById('stallOut');
  if (sup.size===0){
    idle.textContent = '还没有“记录暂停预算”的店 → 去门店健康点一家告警店试试。';
  } else {
    idle.innerHTML = '已暂缓 <b>' + sup.size + '</b> 家店：' + [...sup].join('、') + ' → 共 <b>' + stallCoupons + '</b> 张券暂不发（约 HK$' + (stallCoupons*bface).toLocaleString() + ' 票面价，等查出为什么再决定）。';
  }

  document.getElementById('budgetOut').textContent = weekly + ' 张券 ≈ 覆盖名单前 ' + weekly + ' 人（按净收益从高到低）';

  const selfRet = 0.55;
  const noSpend = GROUPS.normal + GROUPS.low;
  const avoided = Math.round(noSpend * selfRet);
  document.getElementById('saveOut').textContent = '“不用管/低价值” ' + noSpend.toLocaleString() + ' 人 × 其中约 ' + (selfRet*100) + '% 会自己回来 ≈ 省 ' + avoided.toLocaleString() + ' 张券（约 HK$' + (avoided*face).toLocaleString() + ' 票面价）';
  const cash = Math.round(avoided * face * red * mar);
  document.getElementById('cashOut').textContent = '真现金（票面×兑换×毛利）= 约 HK$' + cash.toLocaleString() + ' / 周（券面值/兑换率/毛利都是活的参数）';
  document.getElementById('budgetSub').textContent = '提示：把滑块拖到“建议预算”那张数附近，就是在按看板建议批；名单变大，看板会提醒你加预算。';
}

/* ================= ④ 审批记录 ================= */
function renderAudit(){
  const el = document.getElementById('tab-audit');
  let recs = AUDIT.slice();
  let html = `<div class="gatebar">审批记录：append-only（只增不改）。随机抽一条，都能答出 —— 发了什么 / 谁批的 / 何时 / 凭什么。</div>`;
  if (!recs.length){
    html += `<div class="panel"><h2>还没有记录</h2><div class="muted">去「① 门店健康」点一家告警店“记录不花钱”，或去「② 行动清单」批准一个人，这里就会出现。</div></div>`;
  } else {
    html += `<div class="panel"><h2>审计日志（共 ${recs.length} 条）</h2><table><tr><th>时间</th><th>类型</th><th>对象</th><th>上限/金额</th><th>理由</th><th>操作人</th></tr>`;
    for (const r of recs){
      if (r.type==='approve') html += `<tr><td>${r.at}</td><td><span class="badge b-high">批准</span></td><td class="cid">${r.cid}</td><td class="money">HK$${r.cap} · ${r.ch}</td><td>${r.reason}</td><td>${r.approver}</td></tr>`;
      else html += `<tr><td>${r.at}</td><td><span class="badge b-no_consent">门店抑制</span></td><td class="cid">${r.store}</td><td>本周不花钱</td><td>${r.reason}</td><td>${r.approver}</td></tr>`;
    }
    html += `</table><div class="muted" style="margin-top:8px">这些都记在浏览器里（localStorage），刷新还在；清空即重来。</div>`;
  }
  html += `<div class="panel"><h2>清空重来</h2><button class="btn suppress" onclick="clearAudit()">清空审批记录</button></div>`;
  el.innerHTML = html;
}
function clearAudit(){ if(confirm('确定清空所有审批记录？')){ AUDIT=[]; saveAudit(); renderAudit(); } }
function now(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+d.getMinutes(); }

/* ================= 页签绑定 ================= */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  activeTab(t.dataset.tab);
  if (t.dataset.tab==='stores') renderStores();
  if (t.dataset.tab==='actions') renderActions('all');
  if (t.dataset.tab==='budget') renderBudget();
  if (t.dataset.tab==='audit') renderAudit();
});
renderStores();
</script>
